            <span class="text-xs text-gray-500 uppercase tracking-[0.2em] font-normal">Scroll down</span>

    <script>
        // WebGL-like Background Animation (Canvas)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            const numParticles = Math.floor((width * height) / 25000);
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3
                });
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 180) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateCanvas();

        // 3D WebGL-like Orbital Gallery Animation
        const items = document.querySelectorAll('.gallery-item');
        let time = 0;
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animateFloat() {
            time += 0.004; // Speed of the 3D loop
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            items.forEach((item, index) => {
                // Calculate position in orbit
                const angle = time + (index / items.length) * Math.PI * 2;
                const isMobile = window.innerWidth < 768;
                const radiusX = isMobile ? 130 : 340;
                const radiusZ = isMobile ? 110 : 280;
                
                const x = Math.cos(angle) * radiusX;
                const z = Math.sin(angle) * radiusZ;
                
                // Add vertical wave for natural floating
                const y = Math.sin(angle * 2 + index) * (isMobile ? 30 : 80);

                // Calculate depth ratio (0 = back, 1 = front)
                const depthRatio = (z + radiusZ) / (radiusZ * 2); 
                
                // Front images bigger & opaque, back images smaller & transparent
                const scale = 0.5 + (depthRatio * 0.7); 
                const opacity = 0.15 + (depthRatio * 0.85); 
                
                // Parallax shift based on depth
                const pX = targetX * 80 * depthRatio;
                const pY = targetY * 80 * depthRatio;

                // Apply 3D transforms
                item.style.transform = `translate3d(calc(-50% + ${x + pX}px), calc(-50% + ${y + pY}px), ${z}px) scale(${scale})`;
                item.style.opacity = opacity;
                item.style.zIndex = Math.round(depthRatio * 100);

                // Tilt the images slightly towards the mouse
                const img = item.querySelector('img');
                if(img) {
                    img.style.transform = `rotateX(${-targetY * 15}deg) rotateY(${targetX * 15}deg)`;
                }
            });
            requestAnimationFrame(animateFloat);
        }
        animateFloat();
    </script>
