<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Workload Tuning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FCFCFF] min-h-screen font-['Inter',sans-serif] text-slate-800 overflow-x-hidden selection:bg-red-200 selection:text-red-900">

    <!-- Ethereal Background -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute inset-0 blur-3xl opacity-80 mix-blend-multiply" style="background: radial-gradient(circle at 20% 30%, rgba(252, 165, 165, 0.4) 0%, transparent 50%);"></div>
        <div class="absolute inset-0 blur-3xl opacity-80 mix-blend-multiply" style="transform: translateY(10%) scale(1.2); background: radial-gradient(circle at 80% 70%, rgba(253, 164, 175, 0.3) 0%, transparent 50%);"></div>
        <div class="absolute inset-0 blur-3xl opacity-60 mix-blend-screen" style="transform: translateX(-10%); background: radial-gradient(circle at 50% 50%, rgba(248, 113, 113, 0.2) 0%, transparent 60%);"></div>
        
        <!-- Subtle white fade at bottom -->
        <div class="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-white to-transparent opacity-80"></div>
    </div>

    <!-- Main Application Window Wrapper -->
    <div class="relative z-10 w-full min-h-screen flex items-center justify-center p-2 sm:p-6 lg:p-8">
        
        <div class="w-full h-full max-w-[1400px] min-h-[90vh] bg-white/40 backdrop-blur-2xl rounded-3xl sm:rounded-[2.5rem] border border-white/60 shadow-[0_8px_32px_0_rgba(239,68,68,0.05)] overflow-hidden flex flex-col relative">
            
            <!-- Navbar -->
            <header class="w-full flex items-center justify-between px-6 sm:px-10 py-6">
                <!-- Logo -->
                <div class="flex items-center gap-2 group cursor-pointer">
                    <div class="w-6 h-6 flex items-center justify-center text-red-600 group-hover:text-red-500 transition-colors">
                        <iconify-icon icon="solar:atom-linear" width="24" height="24" stroke-width="1.5"></iconify-icon>
                    </div>
                    <span class="text-sm font-medium text-slate-700 tracking-wide">Ignis</span>
                </div>

                <!-- Center Nav Tabs -->
                <nav class="hidden md:flex items-center bg-white/60 backdrop-blur-md rounded-full px-1 py-1 border border-red-100/50 shadow-sm">
                    <ul class="flex items-center text-xs font-normal text-slate-500">
                        <li>
                            <a href="#" class="block px-5 py-2 rounded-full hover:bg-white/80 hover:text-slate-800 transition-all duration-200">Features</a>
                        </li>
                        <li class="h-3 w-[1px] bg-slate-200"></li>
                        <li>
                            <a href="#" class="block px-5 py-2 rounded-full hover:bg-white/80 hover:text-slate-800 transition-all duration-200">Ecosystem</a>
                        </li>
                        <li class="h-3 w-[1px] bg-slate-200"></li>
                        <li>
                            <a href="#" class="block px-5 py-2 rounded-full hover:bg-white/80 hover:text-slate-800 transition-all duration-200">Analytics</a>
                        </li>
                        <li class="h-3 w-[1px] bg-slate-200"></li>
                        <li>
                            <a href="#" class="block px-5 py-2 rounded-full hover:bg-white/80 hover:text-slate-800 transition-all duration-200">Business</a>
                        </li>
                    </ul>
                </nav>

                <!-- Auth Action -->
                <button class="px-6 py-2 rounded-full border border-red-200 text-xs font-normal text-slate-600 hover:bg-red-50/50 hover:border-red-300 hover:text-red-700 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-red-500/20">
                    Sign In
                </button>
            </header>

            <!-- Hero Section -->
            <main class="flex-1 flex flex-col items-center justify-start pt-10 sm:pt-16 pb-20 relative">
                
                <div class="text-center px-4 z-20 max-w-3xl mx-auto">
                    <h1 class="text-4xl sm:text-5xl lg:text-[4rem] leading-tight tracking-tight font-light text-transparent bg-clip-text bg-gradient-to-br from-red-900 via-red-600 to-rose-400 mb-4 sm:mb-6">
                        Infrastructure Workload Tuning
                    </h1>
                    <p class="text-sm sm:text-base text-slate-500 font-light max-w-xl mx-auto leading-relaxed mb-8 sm:mb-10">
                        Dynamic provisioning, cost containment, and resource agility built specifically for next-generation cloud architectures.
                    </p>
                    
                    <!-- Primary CTA -->
                    <button class="group inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-full bg-gradient-to-r from-[#dc2626] to-[#f43f5e] text-white text-sm font-medium shadow-[0_8px_20px_-6px_rgba(239,68,68,0.6)] hover:shadow-[0_12px_25px_-6px_rgba(239,68,68,0.8)] hover:scale-[1.02] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-[#FCFCFF]">
                        Launch Dashboard
                        <iconify-icon icon="solar:arrow-right-linear" width="18" height="18" stroke-width="1.5" class="group-hover:translate-x-1 transition-transform duration-300"></iconify-icon>
                    </button>
                </div>

                <!-- Abstract UI Graphic (Centerpiece) -->
                <div class="relative w-full max-w-4xl h-[400px] mt-16 sm:mt-24 flex items-center justify-center z-10 pointer-events-none">
                    
                    <!-- Background decorative shapes mimicking WebGL fluid/wireframe -->
                    <div class="absolute w-[400px] h-[300px] bg-red-400/20 rounded-[40%_60%_70%_30%/40%_50%_60%_50%] blur-3xl -ml-40 top-0"></div>
                    <div class="absolute w-[350px] h-[350px] bg-rose-300/20 rounded-[60%_40%_30%_70%/60%_30%_70%_40%] blur-3xl ml-40 bottom-0"></div>
                    
                    <!-- Wireframe contour layers -->
                    <div class="absolute inset-0 flex items-center justify-center opacity-40">
                        <div class="w-[300px] h-[300px] rounded-tl-[100px] absolute -translate-x-20 -translate-y-10" style="-webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%); background-image: repeating-radial-gradient(circle at 0 0, transparent 0, transparent 10px, rgba(239, 68, 68, 0.05) 10px, rgba(239, 68, 68, 0.05) 11px);"></div>
                        <div class="w-[300px] h-[300px] rounded-br-[100px] absolute translate-x-20 translate-y-10" style="-webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%); background-image: repeating-radial-gradient(circle at 100% 100%, transparent 0, transparent 10px, rgba(239, 68, 68, 0.05) 10px, rgba(239, 68, 68, 0.05) 11px);"></div>
                    </div>

                    <!-- Glassy UI Card -->
                    <div class="relative z-20 w-full max-w-[500px] bg-white/70 backdrop-blur-xl border border-white/80 rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(239,68,68,0.15)] p-4 sm:p-6 flex flex-col gap-5 pointer-events-auto hover:shadow-[0_25px_60px_-12px_rgba(239,68,68,0.2)] transition-shadow duration-500">
                        
                        <!-- Top Tabs -->
                        <div class="flex justify-center">
                            <div class="flex items-center gap-1 bg-slate-50/50 border border-slate-100 rounded-full p-1 shadow-inner">
                                <button class="w-10 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-600 hover:bg-white transition-all">
                                    <iconify-icon icon="solar:code-square-linear" width="18" height="18"></iconify-icon>
                                </button>
                                <button class="w-10 h-8 flex items-center justify-center rounded-full bg-white text-red-600 shadow-[0_2px_8px_-2px_rgba(239,68,68,0.2)] transition-all">
                                    <iconify-icon icon="solar:server-square-linear" width="18" height="18"></iconify-icon>
                                </button>
                                <button class="w-10 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-600 hover:bg-white transition-all">
                                    <iconify-icon icon="solar:database-linear" width="18" height="18"></iconify-icon>
                                </button>
                            </div>
                        </div>

                        <!-- Middle Section (Savings) -->
                        <div class="flex items-center justify-between px-2 py-4 relative">
                            <!-- Left Stat -->
                            <div class="flex flex-col gap-1 text-left relative z-10">
                                <span class="text-[10px] font-medium text-slate-400">1.042</span>
                                <div class="flex gap-[2px] items-end h-3">
                                    <div class="w-1.5 h-full bg-red-100 rounded-sm"></div>
                                    <div class="w-1.5 h-[60%] bg-red-100 rounded-sm"></div>
                                    <div class="w-1.5 h-[80%] bg-red-100 rounded-sm"></div>
                                    <div class="w-1.5 h-[40%] bg-red-100 rounded-sm"></div>
                                </div>
                            </div>

                            <!-- Center Label -->
                            <div class="px-6 py-2 rounded-full bg-gradient-to-r from-red-50 to-rose-50 border border-red-100/50 text-xs font-normal text-red-700 shadow-sm relative z-10 flex items-center gap-2">
                                <div class="w-1.5 h-1.5 rounded-full bg-red-400 animate-pulse"></div>
                                Projected Savings
                            </div>

                            <!-- Right Stat -->
                            <div class="flex flex-col gap-1 text-right relative z-10">
                                <span class="text-[10px] font-medium text-slate-400">3.998</span>
                                <div class="flex gap-[2px] items-end h-3 justify-end">
                                    <div class="w-1.5 h-[30%] bg-rose-100 rounded-sm"></div>
                                    <div class="w-1.5 h-[70%] bg-rose-100 rounded-sm"></div>
                                    <div class="w-1.5 h-[50%] bg-rose-100 rounded-sm"></div>
                                    <div class="w-1.5 h-full bg-rose-100 rounded-sm"></div>
                                </div>
                            </div>
                            
                            <!-- Connecting line behind -->
                            <div class="absolute top-1/2 left-4 right-4 h-[1px] bg-gradient-to-r from-transparent via-red-200 to-transparent -translate-y-1/2 z-0"></div>
                        </div>

                        <!-- Bottom Section (Resource blocks) -->
                        <div class="grid grid-cols-2 gap-3 sm:gap-4">
                            <!-- Core Block -->
                            <div class="bg-white/80 border border-slate-100 rounded-2xl p-4 flex flex-col gap-3 shadow-sm hover:border-red-200 transition-colors cursor-default">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">_Compute</span>
                                    <div class="flex items-center gap-1.5 text-sm font-medium text-slate-700">
                                        <iconify-icon icon="solar:graph-up-linear" width="16" height="16" class="text-red-500"></iconify-icon>
                                        68%
                                        <span class="w-1 h-1 rounded-full bg-slate-300 ml-1"></span>
                                    </div>
                                </div>
                                <!-- Sparkline fake -->
                                <div class="w-full h-8 flex items-end justify-between gap-[2px]">
                                    <div class="w-full bg-red-50 rounded-t-sm" style="height: 20%"></div>
                                    <div class="w-full bg-red-100 rounded-t-sm" style="height: 40%"></div>
                                    <div class="w-full bg-red-200 rounded-t-sm" style="height: 35%"></div>
                                    <div class="w-full bg-red-300 rounded-t-sm" style="height: 60%"></div>
                                    <div class="w-full bg-red-400 rounded-t-sm" style="height: 80%"></div>
                                    <div class="w-full bg-red-500 rounded-t-sm" style="height: 68%"></div>
                                </div>
                            </div>

                            <!-- RAM Block -->
                            <div class="bg-white/80 border border-slate-100 rounded-2xl p-4 flex flex-col gap-3 shadow-sm hover:border-rose-200 transition-colors cursor-default">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">_Memory</span>
                                    <div class="flex items-center gap-1.5 text-sm font-medium text-slate-700">
                                        <iconify-icon icon="solar:chart-square-linear" width="16" height="16" class="text-rose-500"></iconify-icon>
                                        51%
                                        <span class="w-1 h-1 rounded-full bg-slate-300 ml-1"></span>
                                    </div>
                                </div>
                                <!-- Sparkline fake -->
                                <div class="w-full h-8 flex items-end justify-between gap-[2px]">
                                    <div class="w-full bg-rose-50 rounded-t-sm" style="height: 80%"></div>
                                    <div class="w-full bg-rose-100 rounded-t-sm" style="height: 60%"></div>
                                    <div class="w-full bg-rose-200 rounded-t-sm" style="height: 40%"></div>
                                    <div class="w-full bg-rose-300 rounded-t-sm" style="height: 50%"></div>
                                    <div class="w-full bg-rose-400 rounded-t-sm" style="height: 70%"></div>
                                    <div class="w-full bg-rose-500 rounded-t-sm" style="height: 51%"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                    
                    <!-- Decorative scale/ruler below -->
                    <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 w-64 h-2 flex justify-between items-end opacity-20">
                        <div class="w-[1px] h-2 bg-slate-800"></div>
                        <div class="w-[1px] h-1 bg-slate-800"></div>
                        <div class="w-[1px] h-1 bg-slate-800"></div>
                        <div class="w-[1px] h-1 bg-slate-800"></div>
                        <div class="w-[1px] h-1.5 bg-slate-800"></div>
                        <div class="w-[1px] h-1 bg-slate-800"></div>
                        <div class="w-[1px] h-1 bg-slate-800"></div>
                        <div class="w-[1px] h-1 bg-slate-800"></div>
                        <div class="w-[1px] h-2 bg-slate-800"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>
</body>
</html>
