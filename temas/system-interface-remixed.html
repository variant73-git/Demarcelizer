<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Interface - Remixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="text-white min-h-screen antialiased selection:bg-blue-500/30 overflow-x-hidden relative" style="background-color: #050505; background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 24px 24px; font-family: 'Space Grotesk', sans-serif;">

    <!-- Interactive Flashlight Overlay -->
    <div id="flashlight" class="pointer-events-none fixed inset-0 z-0 transition-opacity duration-500 opacity-0" style="background-image: radial-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(circle 250px at 50% 50%, black, transparent); -webkit-mask-image: radial-gradient(circle 250px at 50% 50%, black, transparent);"></div>

    <main class="max-w-[1400px] mx-auto p-4 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 relative z-10 min-h-screen content-center">
        
        <!-- Card 1: Top Left -->
        <div class="card-wrapper relative h-[400px] rounded-sm p-[1px] overflow-hidden group" style="background-color: #1F1F1F;">
            <div class="pointer-events-none absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0" style="background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.4), transparent 40%);"></div>
            
            <div class="relative h-full w-full rounded-sm p-6 md:p-8 flex flex-col justify-between overflow-hidden z-10" style="background-color: #0A0A0A;">
                <div class="flex justify-between items-start z-10 relative">
                    <span class="text-xs font-light text-neutral-500 uppercase tracking-widest" style="font-family: 'DM Mono', monospace;">Node_01</span>
                    <div class="flex gap-1">
                        <div class="w-2 h-2" style="background-color: #5EBD3E;"></div>
                        <div class="w-2 h-2" style="background-color: #FFB900;"></div>
                        <div class="w-2 h-2" style="background-color: #F78200;"></div>
                        <div class="w-2 h-2" style="background-color: #E23838;"></div>
                        <div class="w-2 h-2" style="background-color: #973999;"></div>
                        <div class="w-2 h-2" style="background-color: #009CDF;"></div>
                    </div>
                </div>
                
                <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
                    <path class="anim-line" d="M -50 90 L 550 90" stroke="#5EBD3E" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M -50 110 L 250 110 Q 270 110 270 90 L 270 -50" stroke="#FFB900" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M -50 130 L 350 130 Q 370 130 370 110 L 370 -50" stroke="#F78200" stroke-width="3" fill="none" stroke-linecap="square" />
                </svg>

                <div class="z-10 relative mt-auto flex flex-col">
                    <h2 class="text-6xl md:text-7xl tracking-tight text-white/90 leading-none" style="font-family: 'Instrument Serif', serif; font-style: italic;">Activate</h2>
                    <h3 class="text-3xl md:text-4xl tracking-tight text-neutral-400 font-light mt-2" style="font-family: 'Space Grotesk', sans-serif;">.Execute()</h3>
                </div>
            </div>
        </div>

        <!-- Card 2: Top Right -->
        <div class="card-wrapper relative h-[400px] rounded-sm p-[1px] overflow-hidden group" style="background-color: #1F1F1F;">
            <div class="pointer-events-none absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0" style="background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.4), transparent 40%);"></div>
            
            <div class="relative h-full w-full rounded-sm p-6 md:p-8 flex flex-col justify-between overflow-hidden z-10" style="background-color: #0A0A0A;">
                <div class="flex justify-between items-start z-10 relative w-full">
                    <div class="ml-auto flex flex-col items-end gap-3">
                        <div class="flex gap-1">
                            <div class="w-2 h-2" style="background-color: #5EBD3E;"></div>
                            <div class="w-2 h-2" style="background-color: #FFB900;"></div>
                            <div class="w-2 h-2" style="background-color: #F78200;"></div>
                            <div class="w-2 h-2" style="background-color: #E23838;"></div>
                            <div class="w-2 h-2" style="background-color: #973999;"></div>
                            <div class="w-2 h-2" style="background-color: #009CDF;"></div>
                        </div>
                        <span class="text-xs font-light text-neutral-500 text-right max-w-[160px] leading-relaxed" style="font-family: 'DM Mono', monospace;">Verifying connections.</span>
                    </div>
                </div>

                <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
                    <path class="anim-line" d="M 430 -50 L 430 450" stroke="#E23838" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M 450 -50 L 450 450" stroke="#973999" stroke-width="3" fill="none" stroke-linecap="square" />
                </svg>

                <div class="z-10 relative mt-auto flex flex-col w-[85%]">
                    <h2 class="text-3xl md:text-4xl tracking-tight text-neutral-400 font-light" style="font-family: 'Space Grotesk', sans-serif;">Procedural</h2>
                    <h3 class="text-5xl md:text-6xl tracking-tight text-white/90 mt-2 leading-none" style="font-family: 'Instrument Serif', serif; font-style: italic;">Sequences.</h3>
                </div>
            </div>
        </div>

        <!-- Card 3: Bottom Left -->
        <div class="card-wrapper relative h-[400px] rounded-sm p-[1px] overflow-hidden group" style="background-color: #1F1F1F;">
            <div class="pointer-events-none absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0" style="background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.4), transparent 40%);"></div>
            
            <div class="relative h-full w-full rounded-sm p-6 md:p-8 flex flex-col justify-between overflow-hidden z-10" style="background-color: #0A0A0A;">
                <div class="flex justify-between items-start z-10 relative">
                    <span class="text-xs font-light text-neutral-500 uppercase tracking-widest" style="font-family: 'DM Mono', monospace;">Data_Mesh</span>
                    <div class="flex gap-1">
                        <div class="w-2 h-2" style="background-color: #5EBD3E;"></div>
                        <div class="w-2 h-2" style="background-color: #FFB900;"></div>
                        <div class="w-2 h-2" style="background-color: #F78200;"></div>
                        <div class="w-2 h-2" style="background-color: #E23838;"></div>
                        <div class="w-2 h-2" style="background-color: #973999;"></div>
                        <div class="w-2 h-2" style="background-color: #009CDF;"></div>
                    </div>
                </div>

                <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
                    <path class="anim-line" d="M 280 -50 L 280 60 Q 280 80 300 80 L 550 80" stroke="#5EBD3E" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M 300 -50 L 300 80 Q 300 100 320 100 L 550 100" stroke="#FFB900" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M 320 -50 L 320 100 Q 320 120 340 120 L 550 120" stroke="#F78200" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M 340 -50 L 340 120 Q 340 140 360 140 L 550 140" stroke="#E23838" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M 360 -50 L 360 140 Q 360 160 380 160 L 550 160" stroke="#973999" stroke-width="3" fill="none" stroke-linecap="square" />
                    <path class="anim-line" d="M 380 -50 L 380 160 Q 380 180 400 180 L 550 180" stroke="#009CDF" stroke-width="3" fill="none" stroke-linecap="square" />
                </svg>

                <div class="absolute top-[52%] left-[40%] -translate-x-1/2 -translate-y-1/2 z-20 flex items-center gap-2">
                    <div class="w-3 h-3 bg-white"></div>
                    <span class="text-xs font-light text-white tracking-widest" style="font-family: 'DM Mono', monospace;">NODE ALPHA</span>
                </div>

                <div class="z-10 relative mt-auto flex justify-between items-end w-full">
                    <div class="flex flex-col">
                        <h2 class="text-6xl md:text-7xl tracking-tight text-white/90 leading-none" style="font-family: 'Instrument Serif', serif; font-style: italic;">Flow</h2>
                        <h3 class="text-3xl md:text-4xl tracking-tight text-neutral-400 font-light mt-2" style="font-family: 'Space Grotesk', sans-serif;">.Align()</h3>
                    </div>
                    <span class="text-xs font-light text-neutral-500 text-right max-w-[120px] hidden md:block leading-relaxed" style="font-family: 'DM Mono', monospace;">Calibrating metrics.</span>
                </div>
            </div>
        </div>

        <!-- Card 4: Bottom Right -->
        <div class="card-wrapper relative h-[400px] rounded-sm p-[1px] overflow-hidden group" style="background-color: #1F1F1F;">
            <div class="pointer-events-none absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0" style="background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.4), transparent 40%);"></div>
            
            <div class="relative h-full w-full rounded-sm p-6 md:p-8 flex flex-col overflow-hidden z-10" style="background-color: #0A0A0A;">
                <div class="flex justify-between items-start z-10 relative mb-4">
                    <span class="text-xs font-light text-neutral-500 uppercase tracking-widest" style="font-family: 'DM Mono', monospace;">Prism</span>
                    <div class="flex gap-1">
                        <div class="w-2 h-2" style="background-color: #5EBD3E;"></div>
                        <div class="w-2 h-2" style="background-color: #FFB900;"></div>
                        <div class="w-2 h-2" style="background-color: #F78200;"></div>
                        <div class="w-2 h-2" style="background-color: #E23838;"></div>
                        <div class="w-2 h-2" style="background-color: #973999;"></div>
                        <div class="w-2 h-2" style="background-color: #009CDF;"></div>
                    </div>
                </div>
                
                <h2 class="text-5xl md:text-6xl tracking-tight text-white/90 z-10 relative mb-8 leading-none" style="font-family: 'Instrument Serif', serif; font-style: italic;">Visual</h2>

                <div class="flex flex-col flex-grow w-full h-full gap-0 z-10 rounded-sm overflow-hidden" style="border: 1px solid #1F1F1F;">
                    <div class="flex-1 w-full flex justify-between items-center px-4 transition-all hover:px-6" style="background-color: #5EBD3E;">
                        <span class="text-xs font-light text-black/80" style="font-family: 'Space Grotesk', sans-serif;">Green</span>
                        <span class="text-xs font-light text-black/60" style="font-family: 'DM Mono', monospace;">#5EBD3E</span>
                    </div>
                    <div class="flex-1 w-full flex justify-between items-center px-4 transition-all hover:px-6" style="background-color: #FFB900;">
                        <span class="text-xs font-light text-black/80" style="font-family: 'Space Grotesk', sans-serif;">Yellow</span>
                        <span class="text-xs font-light text-black/60" style="font-family: 'DM Mono', monospace;">#FFB900</span>
                    </div>
                    <div class="flex-1 w-full flex justify-between items-center px-4 transition-all hover:px-6" style="background-color: #F78200;">
                        <span class="text-xs font-light text-black/80" style="font-family: 'Space Grotesk', sans-serif;">Orange</span>
                        <span class="text-xs font-light text-black/60" style="font-family: 'DM Mono', monospace;">#F78200</span>
                    </div>
                    <div class="flex-1 w-full flex justify-between items-center px-4 transition-all hover:px-6" style="background-color: #E23838;">
                        <span class="text-xs font-light text-white/90" style="font-family: 'Space Grotesk', sans-serif;">Red</span>
                        <span class="text-xs font-light text-white/70" style="font-family: 'DM Mono', monospace;">#E23838</span>
                    </div>
                    <div class="flex-1 w-full flex justify-between items-center px-4 transition-all hover:px-6" style="background-color: #973999;">
                        <span class="text-xs font-light text-white/90" style="font-family: 'Space Grotesk', sans-serif;">Purple</span>
                        <span class="text-xs font-light text-white/70" style="font-family: 'DM Mono', monospace;">#973999</span>
                    </div>
                    <div class="flex-1 w-full flex justify-between items-center px-4 transition-all hover:px-6" style="background-color: #009CDF;">
                        <span class="text-xs font-light text-white/90" style="font-family: 'Space Grotesk', sans-serif;">Blue</span>
                        <span class="text-xs font-light text-white/70" style="font-family: 'DM Mono', monospace;">#009CDF</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Global Flashlight Effect
            const flashlight = document.getElementById('flashlight');
            document.addEventListener('mousemove', (e) => {
                flashlight.classList.remove('opacity-0');
                const x = e.clientX;
                const y = e.clientY;
                flashlight.style.maskImage = `radial-gradient(circle 250px at ${x}px ${y}px, black, transparent)`;
                flashlight.style.webkitMaskImage = `radial-gradient(circle 250px at ${x}px ${y}px, black, transparent)`;
            });

            // Card Border Flashlight Effect
            const cards = document.querySelectorAll('.card-wrapper');
            cards.forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });

            // SVG Path Animation
            const paths = document.querySelectorAll('.anim-line');
            paths.forEach((path, index) => {
                const length = path.getTotalLength();
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;
                path.getBoundingClientRect(); // Reflow
                
                path.style.transition = `stroke-dashoffset 2s cubic-bezier(0.25, 1, 0.5, 1) ${index * 0.15}s`;
                path.style.strokeDashoffset = '0';

                setTimeout(() => {
                    path.style.transition = 'opacity 3s ease-in-out';
                    let isDim = false;
                    setInterval(() => {
                        path.style.opacity = isDim ? '1' : '0.85';
                        isDim = !isDim;
                    }, 3000 + (index * 500));
                }, 2500);
            });
        });
    </script>
</body>
</html>
