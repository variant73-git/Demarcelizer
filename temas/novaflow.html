<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                },
                extend: {
                    colors: {
                        brand: {
                            lime: '#dcfc5c',
                            blue: '#0062d6',
                            input: '#f4fbfc',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen relative overflow-hidden antialiased selection:bg-brand-lime selection:text-black">

    <!-- Main Content -->
    <main class="relative z-10 w-full max-w-[1500px] mx-auto px-8 pt-16 md:pt-24 flex flex-col md:flex-row justify-between gap-12 md:gap-8">
        
        <!-- Column 1: Brand -->
        <div class="w-full md:w-[28%] flex flex-col items-start">
            <div class="flex items-center gap-3 mb-6">
                <!-- Custom Logo Graphic -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
                    <rect x="2" y="4" width="2.5" height="16" rx="1.25" fill="black"/>
                    <rect x="6.5" y="2" width="2.5" height="20" rx="1.25" fill="black"/>
                    <rect x="11" y="1" width="2.5" height="22" rx="1.25" fill="black"/>
                    <rect x="15.5" y="2" width="2.5" height="20" rx="1.25" fill="black"/>
                    <rect x="20" y="4" width="2.5" height="16" rx="1.25" fill="black"/>
                </svg>
                <h1 class="text-3xl font-semibold tracking-tight text-black">NovaFlow</h1>
            </div>
            <p class="text-sm text-gray-500 leading-relaxed max-w-[280px]">
                NovaFlow is an intelligent data routing system that converts complex API streams into clear, manageable workflows.
            </p>
            <button class="mt-8 bg-brand-lime text-black text-sm font-medium px-5 py-2.5 rounded-xl hover:opacity-90 transition-opacity">
                Legal Info
            </button>
        </div>

        <!-- Column 2: Navigation -->
        <div class="w-full md:w-[15%]">
            <h3 class="text-base font-medium text-black mb-6">Menu</h3>
            <ul class="flex flex-col gap-4">
                <li><a href="#" class="text-sm text-gray-400 hover:text-black transition-colors">Company</a></li>
                <li><a href="#" class="text-sm text-gray-400 hover:text-black transition-colors">Features</a></li>
                <li><a href="#" class="text-sm text-gray-400 hover:text-black transition-colors">Plans</a></li>
                <li><a href="#" class="text-sm text-gray-400 hover:text-black transition-colors">Journal</a></li>
            </ul>
        </div>

        <!-- Column 3: Newsletter -->
        <div class="w-full md:w-[35%]">
            <h3 class="text-base font-medium text-black mb-6">Updates</h3>
            <div class="flex items-center gap-3 w-full max-w-[420px]">
                <input 
                    type="email" 
                    placeholder="Work Email" 
                    class="flex-1 bg-brand-input text-sm text-black placeholder-gray-800 px-5 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-lime/50 transition-all"
                >
                <button class="bg-brand-lime text-black text-sm font-medium px-6 py-3 rounded-xl hover:opacity-90 transition-opacity shrink-0">
                    Join
                </button>
            </div>
            <p class="text-xs text-gray-400 mt-4 max-w-[280px] leading-relaxed">
                Get monthly reports on system architecture and design.
            </p>
        </div>

        <!-- Column 4: Socials -->
        <div class="w-full md:w-[15%] md:text-right">
            <h3 class="text-base font-medium text-black mb-6">Connect</h3>
            <div class="flex md:justify-end gap-4 text-brand-blue">
                <a href="#" class="hover:text-black transition-colors">
                    <iconify-icon icon="solar:twitter-linear" width="28" height="28" style="stroke-width: 1.5px;"></iconify-icon>
                </a>
                <a href="#" class="hover:text-black transition-colors">
                    <iconify-icon icon="solar:linkedin-linear" width="28" height="28" style="stroke-width: 1.5px;"></iconify-icon>
                </a>
            </div>
        </div>

    </main>

    <!-- Animated WebGL-style Background -->
    <div class="fixed bottom-0 left-0 w-full h-[65vh] pointer-events-none z-0 flex items-end justify-center overflow-hidden" style="filter: blur(70px) saturate(140%); mix-blend-mode: multiply;">
        <div class="flex items-end justify-center w-[120%] h-full ml-[-10%] pb-[-5%] gap-[-2px]">
            <!-- Bars generated via JS to satisfy WebGL/Animation request while maintaining performance -->
        </div>
    </div>

    <script>
        // Generates the animated graphic to simulate the WebGL effect
        const container = document.querySelector('.fixed > div.flex');
        const numBars = 9;
        
        // Approximation of the normal distribution heights seen in the reference
        const heights = [25, 45, 65, 85, 100, 85, 65, 45, 25];
        const bars = [];

        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'flex-1 mx-[-2px] transform-gpu origin-bottom';
            // Gradient matching the visual exactly
            bar.style.background = 'linear-gradient(180deg, #dcfc5c 0%, #0062d6 55%, #000000 90%)';
            bar.style.height = `${heights[i]}%`;
            container.appendChild(bar);
            bars.push({ element: bar, baseHeight: heights[i], phase: i * 0.5 });
        }

        let time = 0;
        function animate() {
            time += 0.015;
            bars.forEach(barData => {
                // Subtle breathing animation
                const offset = Math.sin(time + barData.phase) * 4;
                barData.element.style.height = `${barData.baseHeight + offset}%`;
            });
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
