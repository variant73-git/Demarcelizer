    <!-- GSAP Initialization Script -->
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrollTrigger);
            
            // Masked Staggered Word Reveal
            gsap.to('.reveal-word', {
                y: '0%',
                opacity: 1,
                duration: 1.2,
                ease: 'power4.out',
                stagger: 0.08,
                scrollTrigger: {
                    trigger: '.gs-reveal-title',
                    start: 'top 85%'
                }
            });
        });
    </script>
